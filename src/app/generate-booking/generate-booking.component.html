<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-5 shadow-sm d-flex flex-column justify-content-between booking-card">
    <!-- Parte superior: título y controles -->
    <div>
      <h2 class="text-center text-primary mb-5 fs-1">Reservar taquilla {{ box.boxId }}</h2>

      <!-- Label Nº DÍAS -->
      <div class="text-center mb-4">
        <span class="fw-bold text-secondary fs-3">Nº DÍAS</span>
      </div>

      <!-- Selector de días -->
      <div class="d-flex justify-content-center align-items-center mb-5">
        <button class="btn btn-primary btn-lg me-5 day-btn" (click)="decrementDays()">
            <i class="bi bi-dash"></i>
        </button>

        <span class="fs-1 fw-bold mx-4">{{ days }}</span>

        <button class="btn btn-primary btn-lg ms-5 day-btn" (click)="incrementDays()">
            <i class="bi bi-plus"></i>
        </button>
      </div>

      <!-- Método de contacto -->
      <div class="mb-4 text-center fs-4">
        <div class="form-check form-check-inline mb-3 me-5">
          <input class="form-check-input" type="radio" name="contact" id="emailOption"
                 (change)="contactMethod='email'" [checked]="contactMethod==='email'">
          <label class="form-check-label" for="emailOption">Email</label>
        </div>
        <div class="form-check form-check-inline mb-3 ms-5">
          <input class="form-check-input" type="radio" name="contact" id="smsOption"
                 (change)="contactMethod='sms'" [checked]="contactMethod==='sms'">
          <label class="form-check-label" for="smsOption">SMS</label>
        </div>
      </div>

      <!-- Campos condicionales -->
      <div *ngIf="contactMethod==='email'" class="mb-3">
        <input type="email" class="form-control form-control-lg input-big" 
                placeholder="Introduce tu email"
                [(ngModel)]="email">
      </div>

<!-- Teléfono -->
       <div *ngIf="contactMethod==='sms'" class="mb-3">
         <input type="text" class="form-control form-control-lg input-big" 
            placeholder="Introduce tu número de teléfono"
            [(ngModel)]="phone">
        </div>
    </div>

    <!-- Botón Finalizar fijo abajo -->
    <div class="mt-auto">
      <button class="btn btn-primary btn-lg w-100 finalize-btn" (click)="finalizeBooking()">Finalizar</button>
    </div>
  </div>
</div>
